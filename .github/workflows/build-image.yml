name: Build image

# Builds this app's Dockerfile multi-arch (amd64 + arm64) and pushes to GHCR as
#   ghcr.io/<owner>/<repo-name>:<manifest version>   (+ :latest)
# The repo is named OpenMasjidDonations, so the image is
#   ghcr.io/openmasjid-solutions/openmasjiddonations
# which is what docker-compose.yml references.
#
# TWO CHANNELS (the org's Update Channel toggle in OpenMasjidOS):
#
#   main / v* tags  ->  :<version>  +  :latest    stable, e.g. :0.40.1
#   dev             ->  :<version>  +  :dev       development, e.g. :0.41.0-dev.1
#
# Both channels publish the EXACT `version:` from manifest.yaml as an immutable tag.
# That is not cosmetic: OpenMasjidOS detects an update by comparing the catalog's
# version with the installed one, so a dev build reusing the stable version is
# invisible to the platform no matter how often it is published — nothing to notify,
# nothing to update to. Dev versions are therefore semver prereleases, `X.Y.Z-dev.N`,
# ordering after the last release and before the next (0.40.1 < 0.41.0-dev.1 < 0.41.0).
#
# `:dev` and `:latest` are MOVING aliases kept for convenience. Neither is ever the
# only tag, and neither is what the catalog pins — it pins the versioned tag, which
# is immutable and therefore also the thing to roll back to.
#
# After the first run, make the GHCR package Public (owner -> Packages -> package
# settings) so masjid hosts can pull it without authentication.

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    # Changes that don't affect the image — skip the (slow) multi-arch build.
    # docker-compose.yml is NOT part of the image build context (the Dockerfile only
    # copies server/ + web/), so a compose change (e.g. pinning the image @sha256
    # digest) must not trigger a rebuild that would move the tag off the pinned digest.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'LICENSE'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Every third-party Action is pinned to an immutable commit SHA, not a moving major tag
    # (DONATIONS-004). This job holds `packages: write` and a GHCR credential for the image every
    # masjid Raspberry Pi pulls, so an upstream owner (or anyone who compromises one of these
    # repos) repointing `v6` would run their code next to a live publish token. cla.yml already
    # pins its action this way; this file did not. Each SHA below is exactly what the tag it
    # replaces resolved to on 2026-08-03 — nothing was upgraded, only frozen.
    # To update: read the release notes, then `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve image name, version + channel tags
        id: meta
        run: |
          ver=$(grep -E '^version:' manifest.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d "\"' \r")
          owner=${GITHUB_REPOSITORY_OWNER,,}
          name=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/$name"

          # Which channel to publish is decided by the REF, not by the event, so a manual
          # workflow_dispatch run on `dev` can never publish `:latest` from dev code.
          if [ "$GITHUB_REF" = 'refs/heads/dev' ]; then channel=dev; else channel=stable; fi

          # The version IS the image tag on both channels — that is what makes update
          # detection work. OpenMasjidOS spots an update by comparing the catalog's
          # `version` with the installed one, so a dev build that reuses the stable
          # version is invisible to it however many times we publish. Guard both ways:
          if [ -z "$ver" ]; then
            echo "::error::manifest.yaml has no version: — the image tag comes from it."; exit 1
          fi
          case "$ver" in
            *-dev.*) prerelease=yes ;;
            *)       prerelease=no  ;;
          esac
          if [ "$channel" = dev ] && [ "$prerelease" = no ]; then
            echo "::error::dev builds need a prerelease version (X.Y.Z-dev.N) — manifest.yaml says '$ver'."
            echo "::error::Reusing a stable version means the platform cannot see the update. Bump it, then push."
            exit 1
          fi
          if [ "$channel" = stable ] && [ "$prerelease" = yes ]; then
            echo "::error::the stable channel refuses a prerelease version — manifest.yaml says '$ver'."
            echo "::error::Set it to the real release (drop the -dev.N) before merging to main."
            exit 1
          fi

          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          # Multi-line output. Nothing else may write to $GITHUB_OUTPUT between the
          # delimiters, or it would be swallowed into the value — so everything else is
          # written above, and the tags are echoed straight into the block below (no
          # shell variable, so no YAML indentation can leak into a tag).
          #
          # BOTH channels publish the exact manifest version as an immutable tag; only
          # the moving alias differs (:latest for stable, :dev for development). The
          # catalog pins the versioned one — the alias is a convenience, never the only
          # tag, because a moving tag alone gives the platform nothing to update to.
          {
            echo 'tags<<TAGS_EOF'
            echo "$image:$ver"
            if [ "$channel" = dev ]; then echo "$image:dev"; else echo "$image:latest"; fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "publishing the $channel channel as $ver"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publishes the version-pinned (+ latest) image on main and on v* tags, like the
      # OpenMasjidDisplay template, or the moving :dev pair on the dev branch. Bump
      # manifest.yaml `version:` for each meaningful change so a pinned install stays
      # stable (the catalog pins a git tag + version). Both arches always: a masjid box
      # is usually a Raspberry Pi, so an amd64-only dev image would be untestable where
      # it actually runs.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: tell the OpenMasjidAPPS catalog to rebuild after a release.
      # Requires a repo secret CATALOG_DISPATCH_TOKEN (a PAT with 'repo' scope).
      # - name: Notify catalog
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   env:
      #     GH_TOKEN: ${{ secrets.CATALOG_DISPATCH_TOKEN }}
      #   run: gh api repos/OpenMasjid-Solutions/OpenMasjidAPPS/dispatches -f event_type=rebuild-catalog
