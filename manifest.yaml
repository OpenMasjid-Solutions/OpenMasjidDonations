id: donations
name: OpenMasjid Donations
tagline: Take card donations on your masjid's network with Stripe
category: donations
version: 0.44.0
author: OpenMasjid-Solutions
license: AGPL-3.0-only
icon: icon.svg
screenshots:
  - screenshots/1.svg
description: |
  **OpenMasjid Donations** gives your masjid a beautiful, self-hosted donation
  website powered by **Stripe**. Put it on a screen by the door with a QR code, or
  open it on any phone — a supporter picks a cause, chooses a preset or their own
  amount (one-time or monthly), and pays securely by card.

  - **Appeals you control** — create as many as you like (General Fund, Zakat,
    Building Fund, Ramadan Appeal…), each with its own wording, images, preset
    amounts and an optional goal.
  - **Preset *and* custom amounts** — clear suggested buttons plus a "choose your
    own" field, one-time or monthly.
  - **Card payments, on your own page** — powered by Stripe's secure card field.
    Your masjid's card details and keys stay on your device; supporters' card
    numbers go straight to Stripe and never touch this app.
  - **A simple admin panel** — manage appeals, see your donations and totals,
    export a spreadsheet, and set your theme to match the rest of OpenMasjidOS.

  **Nothing to fill in here — just install.** When it's running, click **Open** —
  it signs you in with your OpenMasjidOS login and matches your dashboard's
  light/dark look and wallpaper. Then add your Stripe keys and your first appeal
  inside the app. It runs happily on a Raspberry Pi or mini-PC, on your masjid's
  own network.

# OpenMasjidOS Fabric: opt into single sign-on. The platform issues this app a
# per-app secret at install (OPENMASJID_APP_SECRET) and honors its identity-bound
# /api/auth/session calls, so "Open" signs you in with your OpenMasjidOS login.
# The app still works fully standalone (its own admin password) when the Fabric is
# absent. The compose MUST reference the injected vars in `environment:` (it does).
sso: true
# Fabric notifications. RETAINED, though nothing in this app posts to /api/fabric/notify any more
# (v0.43.0): that relay reached the masjid's WEBHOOK ONLY with no per-event control, and the alert
# channel below strictly dominates it — the same webhook, plus the admin's email, per declared event,
# with an on/off the admin owns. Keeping both would have posted twice for one event. The flag stays
# because it is how the platform knows this app has something to say, and alert delivery uses the
# masjid's notification-channel configuration.
notifications: true
# This app uses Stripe's in-page secure card field (Elements), which requires a
# browser secure context — so it MUST be served over HTTPS. The platform serves
# it on a dedicated HTTPS port (terminating TLS with the dashboard's cert); this
# container stays a plain HTTP server and does nothing special for TLS.
https: true
# Opt into the Fabric Stripe capability: the admin configures Stripe ONCE in
# OpenMasjidOS (Settings → Payments) and this app fetches the vaulted keys
# server-to-server (never pasted here, never stored on this app's disk, backed up
# and migrated with the platform). Falls back to locally-entered keys when run
# standalone. The platform issues the per-app secret used to fetch them.
stripe: true
# Opt into the Fabric remote-access/public-URL capability. The admin runs ONE
# Cloudflare Tunnel in OpenMasjidOS (Settings → Remote access); the platform reaches
# this app on a single hostname under an admin-chosen path (default the app id), e.g.
# https://omos.<domain>/donate/…. We ask the platform for our public base + path via
# GET /api/fabric/site and use it for share links, QR codes and the Stripe webhook URL.
# Cloudflare forwards the FULL path prefix (it does not strip it), so the server is
# base-path aware (strips the prefix before routing; injects <base href> into the SPA).
# Falls back to this device's own address when remote access is off / standalone.
domain: true
# Opt into the Fabric app-to-app broker as a CONSUMER of the OpenMasjid Students app's
# `billing` capability. A campaign whose type is `tuition` becomes a thin shell around
# Students: a parent types their child's Student ID, confirms the name we echo back, and we
# fetch the family balance from Students over the broker (POST
# ${OPENMASJID_BASE_URL}/api/fabric/app/students/billing/<method>, server→server with our
# per-app secret); they pay by card, and we record the payment back into the Students ledger.
# Students OWNS everything inside a tuition campaign. This grant (declared here) + the target's
# matching `provides` are what let the OS broker route our calls; without it every call is 403
# not_granted. LAN-only, fail-soft: any broker error (target_not_installed / unreachable /
# timeout) hides the tuition campaign — the donation site always works regardless. See
# docs/STUDENTS_INTEGRATION.md + the authoritative students/billing v2 contract
# (OpenMasjidStudentManager/docs/FABRIC_BILLING_CONTRACT.md).
fabric:
  consumes:
    - students/billing
# Opt into Fabric email (platform v0.41.0+): the admin sets up ONE email provider (SMTP or
# Resend) once in OpenMasjidOS → Settings → Email, and we send a donor a branded receipt via
# POST /api/fabric/email — we never see the mail credentials or the From address. Opt-in in the
# app (admin toggle + editable receipt) and fail-soft: if email isn't set up ("not_configured")
# we simply don't email and still record the donation + show the on-screen thank-you.
email: true
# Opt into Fabric WhatsApp (platform v0.51.0+): the masjid installs the OpenWA gateway and links
# THEIR OWN number in OpenMasjidOS; we POST /api/fabric/whatsapp and the platform does the sending.
# We never see the gateway, its credentials, or which number is linked.
#
# In this app WhatsApp is an ADMIN channel: the masjid enters a number — or picks an approved group —
# per notification on our own Settings screen. We never collect a phone number from a donor and never
# message one.
#
# Needs platform 0.51.0+ to send; message status and the durable queue need 0.51.1+ (we detect that
# with `outcomes` on the availability probe, and treat an absent field as no).
#
# Two rules that shape every use of it here. The API returns 202 {queued:true, id} and NEVER "sent":
# there is no delivery receipt from WhatsApp. Since 0.51.1 the platform imposes no pacing at all —
# no quiet hours, no caps, no cooldowns — so a message leaves within seconds and the BOUND IS OURS:
# 20 per destination per hour, one message per event, and what we hold back is shown to the admin.
# Ban risk still attaches to the NUMBER, which is shared with every app on the box and cannot be
# recovered once blocked. And nothing may DEPEND on a message arriving —
# it is an unofficial client whose number can be restricted at any time. Note the second rule is
# deliberately weaker than "WhatsApp is always a second copy", which per-event settings made false:
# an admin may legitimately choose WhatsApp and nothing else for an event. What still holds is that
# the donation is in the database and the panel either way, and no donor outcome depends on it.
whatsapp: true
# Admin alerts (platform v0.41.0+): each declared type gets a granular Email/Webhook on-off in
# OpenMasjidOS → Settings → Alerts. The admin still owns THOSE channels — we cannot read or change
# them, and `disabled_by_admin` is a normal answer. What the app additionally owns, since v0.43.0, is
# WHICH events it raises at all and who else hears them: Settings → Notifications in the app carries a
# specific email address and a WhatsApp destination per event. The two layers are an AND for this
# channel. We fire one with POST /api/fabric/alert. (No `reader-offline` here — this is a
# web/Stripe-Elements app with no card reader; that alert belongs to the Kiosk.)
#
# `donation-received` and `donation-recovered` are new in v0.43.0. Before them, "a donation arrived"
# went out via POST /api/fabric/notify, which reaches the masjid's WEBHOOK ONLY — so the one
# notification every masjid actually wants could never reach an inbox. They are what makes "email on
# by default" true rather than aspirational.
alerts:
  - id: donation-received
    label: A donation was received
    description: Somebody gave. Says how much and which appeal — never who, since an alert can be forwarded and the donor didn't agree to that. If a busy Friday is too much, leave this one unticked for the people who don't need every gift (Settings → Notifications).
  - id: donation-recovered
    label: A donation was found and added
    description: A card payment had gone through but never reached your records (the donor's page didn't finish loading), and the app has now found it and added it, dated when the money actually arrived. Your totals will go up.
  - id: payment-failed
    label: A payment couldn't be started
    description: Stripe rejected a payment setup (e.g. bad or expired keys, or Stripe is down) — donors can't give until it's fixed.
  - id: tuition-record-failed
    label: A tuition payment wasn't recorded in Students
    description: A card payment succeeded but OpenMasjid Students rejected recording it. The money is safe (Students' reconciliation is the backstop) — please verify.
  - id: donation-refunded
    label: A donation was refunded
    description: Money was sent back to a donor — from this app's Donations tab, or straight from your Stripe dashboard. Says how much, which appeal, and who did it, so whoever looks after the accounts hears about it even if somebody else pressed the button.
  - id: plan-stopped
    label: A monthly donation was stopped by the donor
    description: A monthly donor used the link in their confirmation email to stop their own payments. Nothing more is taken from their card. Worth knowing about, since nobody at the masjid pressed anything.
  - id: whatsapp-gap
    label: Some WhatsApp messages may not have arrived
    description: Your masjid's WhatsApp link had expired without OpenMasjidOS noticing, so messages sent during that period were reported as sent but never delivered. Nothing was lost — every donation, refund and change is in your records as normal; only the messages went missing. Says when the gap was and how many messages fell in it.
  - id: test
    label: Test message
    description: A test you trigger from the app (Settings → Email receipt → "Send me a test") to confirm OpenMasjidOS is reaching you by email/webhook.

# Admin commands (platform v0.51.0+): an authorized admin messages the masjid's number with
# `!donations` and the platform renders the menu, decides who may run what, and POSTs the chosen
# command to POST /fabric/commands/run on our own web port.
#
# Every one of these is READ-ONLY and aggregate, and that is the whole design:
#   * Nothing here changes anything. In a channel this informal the blast radius of a mistake
#     should be a wrong figure on a screen, never a closed appeal or a refunded donation.
#   * NO DONOR IS EVER NAMED — no name, no email, no reference. A WhatsApp message is forwardable
#     and screenshottable and the donor never agreed to be in one, so a command says "$312 from 9
#     donations", never who gave it. Donor records stay in the panel, behind a login.
#   * Every figure comes from this app's own database. There is a 10-second timeout and somebody is
#     holding a phone, so nothing here calls Stripe.
# `confirm:` is deliberately absent throughout — it exists for things people will see or that
# cannot be undone, and reading a number back is neither.
commands:
  - id: today
    label: What's come in today
    description: Today's donations and the month so far.
  - id: month
    label: This month so far
    description: This month's total, next to the whole of last month.
  - id: totals
    label: Overall totals
    description: All-time raised, the number of donations, and the average gift.
  - id: appeal
    label: How an appeal is doing
    description: One appeal's total and how close it is to its goal. Asks which, if you don't say.
    argument:
      label: appeal name
      required: false
  - id: monthly
    label: Monthly donors
    description: How many people give every month, and roughly how much that is.

# NO install settings — install is truly one-click (the platform shows no dialog).
# Everything is chosen INSIDE the app: on its admin Payments screen it lists the
# masjid's Stripe accounts from the Fabric (GET /api/fabric/stripe/accounts) and lets
# the admin pick one, then fetches that account's keys (GET /api/fabric/stripe?account=<id>).
# Masjid details / currency / standalone local keys are collected in the app's first-run setup.
ports:
  - container: 8080
    label: Donations site
